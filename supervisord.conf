[supervisord]
nodaemon=true
pidfile=/var/run/supervisord.pid
logfile=/var/log/supervisor/supervisord.log

[program:codeserver]
command = /usr/bin/code-server /coursework --bind-addr 0.0.0.0 --auth none
user = student
autostart = true
autorestart = true
stdout_logfile = /var/log/supervisor/codeserver.log
stderr_logfile = /var/log/supervisor/codeserver_errors.log
environment = NODE_ENV="production"

; One-shot warm-up so the first F5 isn't paying to cold-read the ~76MB .NET
; debug adapter and gdb from disk: run each once at boot to pull them into the
; page cache. The adapter exits on stdin EOF; timeout is a safety net.
[program:warmup]
command = /bin/bash -c "gdb -q -ex quit; for da in /home/student/.local/share/code-server/extensions/kylinideteam.cppdebug-*/dist/debugAdapter/OpenDebugAD7; do timeout 10 \"$da\" < /dev/null; done; true"
user = student
autostart = true
autorestart = false
startsecs = 0
priority = 999
stdout_logfile = /dev/null
stderr_logfile = /dev/null
